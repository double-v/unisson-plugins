id = "safeplace"
nom = "Safeplace"
version = "1.1.1"
description = "Signaler des artistes (accusations, condamnations) et proposer de les mettre à la corbeille."
categorie = "officiel"
coeur = ">=0.2"
actif_par_defaut = false

[front_abi]
admin = 1

[apporte]
routes = true
migrations = true
outils_chat = ["safeplace_check_artist_status"]
types_operation = ["safeplace.signaler"]
# Ce que la purge supprime (cœur ≥ lot 5 de la spec 018) : la table adoptée.
tables = ["artist_flags"]
