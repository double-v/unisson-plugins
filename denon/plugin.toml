id = "denon"
nom = "Denon"
version = "0.4.2"
description = "Partage l'ampli Denon (une seule connexion telnet) entre unisson, Hublot et les autres : l'API de denon-api, sans conteneur à part."
categorie = "officiel"
coeur = ">=0.7"             # les playlists dynamiques -1 et -2 (favoris) dans pistes_playlist et tirer_pistes (0.7, unisson#1077) ; meme_origine, la garde des routes du réveil (0.6) ; la séance : flux_lecteur, tirer_pistes, marquer_jouee… (0.5) ; cles_heritees (0.4) ; plugin_denon (0.3)
actif_par_defaut = false

[front_abi]
admin = 1                   # la page « Réveil » (Extensions), compilée dans front/admin/index.js

[apporte]
routes = true
migrations = true           # plugin_denon.alarmes (le réveil)

[[reglages]]
cle = "hote"
type = "str"                # IP de l'ampli ; vide : le lien attend

[[reglages]]
cle = "port_telnet"
type = "int"
defaut = 23

[[reglages]]
cle = "cadence_ms"
type = "int"
defaut = 900                # un AVR perd des commandes plus rapprochées

[[reglages]]
cle = "pilote"
type = "str"
defaut = "avrx4000"

[[reglages]]
cle = "jeton"
type = "str"
secret = true               # vide : routes ouvertes, comme denon-api

[[reglages]]
cle = "port_ecoute"
type = "int"
defaut = 0                  # 8100 : l'adresse de denon-api, pour Hublot ; 0 : pas d'écoute à part

[[reglages]]
cle = "fuseau"
type = "str"
defaut = "Europe/Paris"     # l'heure des alarmes est une heure locale ; nom IANA

[[reglages]]
cle = "hote_upnp"
type = "str"                # hôte UPnP de l'ampli (description sur le port 8080), ou l'URL de description.xml ; vide : l'hôte telnet

[[reglages]]
cle = "delai_reveil_s"
type = "str"                # secondes entre PWON et le premier Play ; vide : celui du pilote (8 s sur l'AVR-X4000, à confirmer en R0)

[cles_heritees]
denon_host = "hote"
denon_telnet_port = "port_telnet"
